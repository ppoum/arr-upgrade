[package]
name = "arr-upgrade"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
arr-api = { path = "../arr-api/" }
chrono = "0.4.45"
env_logger = "0.11.11"
log = "0.4.34"
oneshot = { version = "0.2.1", features = ["async"] }
rand = "0.10.2"
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = ["chrono", "macros", "migrate", "runtime-tokio", "sqlite"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
