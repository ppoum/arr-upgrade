[package]
name = "arr-upgrade"
version = "0.1.0"
edition = "2024"

[lib]
name = "lib"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.104"
arr-api = { path = "../arr-api/" }
chrono = "0.4.45"
cron = "0.17.0"
env_logger = "0.11.11"
futures = "0.3.34"
log = "0.4.34"
oneshot = { version = "0.2.1", features = ["async"] }
serde = { version = "1.0.229", features = ["derive"] }
sqlx = { version = "0.9.0", features = [
  "chrono",
  "macros",
  "migrate",
  "runtime-tokio",
  "sqlite",
] }
tokio = { version = "1.53.1", features = [
  "macros",
  "rt-multi-thread",
  "signal",
  "sync",
] }
tokio-util = { version = "0.7.19", features = ["rt"] }
toml = "1.1.6"

[dev-dependencies]
tempfile = "3.27.0"
